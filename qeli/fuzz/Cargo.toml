[package]
name = "qeli-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aes-gcm = "0.10"

# Only the cross-platform parser core (config/crypto/protocol/util) is needed —
# default-features off drops the Linux-only server/client/tun/web stack, so the
# fuzz crate builds fast and targets exactly the untrusted-input parsers.
[dependencies.qeli_core]
package = "qeli"
path = ".."
default-features = false
features = ["fuzzing"]

[[bin]]
name = "clienthello"
path = "fuzz_targets/clienthello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_config"
path = "fuzz_targets/client_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket_head"
path = "fuzz_targets/websocket_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packet_decrypt"
path = "fuzz_targets/packet_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "realtls_record"
path = "fuzz_targets/realtls_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "udp_frag"
path = "fuzz_targets/udp_frag.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_frag"
path = "fuzz_targets/data_frag.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roaming_wire"
path = "fuzz_targets/roaming_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quic"
path = "fuzz_targets/quic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "obfs_datagram"
path = "fuzz_targets/obfs_datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ip_packet"
path = "fuzz_targets/ip_packet.rs"
test = false
doc = false
bench = false
[[bin]]
name = "control_v2"
path = "fuzz_targets/control_v2.rs"
test = false
doc = false
bench = false

# cargo-fuzz needs some debuginfo in release for useful crash backtraces.
[profile.release]
debug = 1

[[bin]]
name = "realtls_client"
path = "fuzz_targets/realtls_client.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket_frame"
path = "fuzz_targets/websocket_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quic_envelope"
path = "fuzz_targets/quic_envelope.rs"
test = false
doc = false
bench = false
