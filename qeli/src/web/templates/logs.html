<div x-data="logsPage">

  <!-- Toolbar -->
  <div class="flex flex-wrap items-center gap-3 mb-4">
    <div class="flex items-center gap-2 flex-1 min-w-0">
      <div class="relative flex-1 min-w-0 max-w-xs">
        <input class="inp h-8 text-xs w-full" style="padding-left:2rem" type="text" x-model="search" @input="applyFilter()" placeholder="Search logs…">
        <svg class="absolute left-2.5 top-2 w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/></svg>
      </div>
      <select class="inp inp-compact inp-fit flex-shrink-0" x-model.number="maxLines" @change="load()">
        <option value="100">100 lines</option>
        <option value="200">200 lines</option>
        <option value="500">500 lines</option>
        <option value="1000">1000 lines</option>
      </select>
    </div>
    <div class="flex items-center gap-2">
      <label class="flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer select-none">
        <div class="toggle-wrap" aria-label="Auto-refresh"
          @click="[autoRefresh = !autoRefresh, handleAutoRefresh()]">
          <div class="toggle toggle-sm" :class="autoRefresh ? 'bg-blue-600' : 'bg-slate-700'">
            <div class="toggle-dot" :class="autoRefresh ? 'translate-x-4' : 'translate-x-0.5'"></div>
          </div>
        </div>
        Auto-refresh
      </label>
      <button class="btn btn-ghost btn-sm" @click="load()" :disabled="loading">
        <div x-show="loading" class="w-3.5 h-3.5 rounded-full border-2 border-blue-400 border-t-transparent animate-spin"></div>
        <svg x-show="!loading" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Refresh
      </button>
      <button class="btn btn-ghost btn-sm" @click="scrollBottom()">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
        Bottom
      </button>
    </div>
  </div>

  <!-- Stats bar -->
  <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs mb-3">
    <span class="text-slate-500">
      Path: <code class="text-slate-400 font-mono" x-text="logPath || 'journald (no file)'"></code>
    </span>
    <span class="text-slate-600">·</span>
    <span class="text-slate-500">Showing <strong class="text-white" x-text="filtered.length"></strong> / <strong x-text="lines.length"></strong> lines</span>
    <div class="flex flex-wrap items-center gap-1.5" role="group" aria-label="Log level filters">
      <button type="button" class="badge log-level-filter log-level-filter-all"
        :aria-pressed="allLevelsSelected" @click="clearLevelFilter()">
        <span>All levels</span>
        <span x-text="searchMatchCount"></span>
      </button>
      <template x-for="[logLevel, count] in levelCounts" :key="logLevel">
        <button type="button" class="badge log-level-filter" :class="levelBadge(logLevel)"
          :aria-pressed="isLevelSelected(logLevel)"
          :disabled="count === 0 && !isLevelSelected(logLevel)"
          @click="toggleLevel(logLevel)"
          x-text="logLevel + ' ' + count"></button>
      </template>
    </div>
  </div>

  <!-- Log output -->
  <div class="card overflow-hidden" style="font-family:'JetBrains Mono','Fira Code',monospace">
    <div id="log-container" class="overflow-auto" style="height:calc(100vh - 260px);background:var(--log-bg);padding:12px 0">
      <div x-show="!loading && filtered.length === 0" class="text-center text-slate-600 text-sm py-12">
        No log entries match the current filter
      </div>
      <template x-for="line in filtered" :key="line.index">
        <div class="flex hover:bg-white/5 group px-3 py-0.5" style="min-height:22px">
          <div class="w-7 text-slate-700 text-right mr-3 flex-shrink-0 text-[10px] leading-[22px]" x-text="line.index + 1"></div>
          <div class="flex-1 text-[11.5px] leading-[22px] whitespace-pre-wrap break-all"
            :class="lineColor(line.text)" x-text="line.text"></div>
        </div>
      </template>
    </div>
  </div>

</div>

<script>
function logsPage() {
  return {
    lines: [],
    filtered: [],
    logPath: '',
    loading: false,
    autoRefresh: false,
    autoRefreshTimer: null,
    search: '',
    selectedLevels: [],
    levelOrder: ['ERROR', 'WARN', 'INFO', 'DEBUG', 'TRACE'],
    maxLines: 200,

    init() { this.load().then(() => this.scrollBottom()); },

    get allLevelsSelected() {
      return this.selectedLevels.length === 0;
    },

    get searchMatches() {
      const query = this.search.trim().toLowerCase();
      return this.lines
        .map((text, index) => ({ text, index, level: this.parseLevel(text) }))
        .filter(entry => !query || entry.text.toLowerCase().includes(query));
    },

    get searchMatchCount() {
      return this.searchMatches.length;
    },

    get levelCounts() {
      const counts = Object.fromEntries(this.levelOrder.map(level => [level, 0]));
      for (const entry of this.searchMatches) {
        if (entry.level) counts[entry.level] += 1;
      }
      return this.levelOrder.map(level => [level, counts[level]]);
    },

    async load() {
      this.loading = true;
      try {
        const params = new URLSearchParams({ lines: this.maxLines });
        const d = await apiFetch('api/logs?' + params);
        if (d.ok) {
          this.lines = d.lines || [];
          this.logPath = d.path || '';
          this.applyFilter();
        } else {
          this.lines = ['[Error: ' + (d.error || 'unknown') + ']'];
          this.applyFilter();
        }
      } catch (e) {
        this.lines = ['[Network error: ' + e.message + ']'];
        this.applyFilter();
      } finally {
        this.loading = false;
      }
    },

    applyFilter() {
      const selected = new Set(this.selectedLevels);
      this.filtered = this.searchMatches.filter(
        entry => selected.size === 0 || selected.has(entry.level),
      );
    },

    parseLevel(line) {
      // A qeli log line is <timestamp> LEVEL target: message (or starts with
      // LEVEL when timestamps are disabled). Use the first severity token only:
      // words such as "ERROR" inside an INFO message must not change its level.
      const match = line.match(/(?:^|\s)(ERROR|WARN|INFO|DEBUG|TRACE)(?=\s)/);
      return match ? match[1] : '';
    },

    isLevelSelected(level) {
      return this.selectedLevels.includes(level);
    },

    clearLevelFilter() {
      this.selectedLevels = [];
      this.applyFilter();
    },

    toggleLevel(level) {
      if (this.allLevelsSelected) {
        this.selectedLevels = [level];
      } else if (this.isLevelSelected(level)) {
        this.selectedLevels = this.selectedLevels.filter(item => item !== level);
      } else {
        this.selectedLevels = [...this.selectedLevels, level];
      }
      this.applyFilter();
    },

    handleAutoRefresh() {
      clearInterval(this.autoRefreshTimer);
      if (this.autoRefresh) {
        this.autoRefreshTimer = setInterval(() => {
          this.load().then(() => {
            if (this.autoRefresh) this.scrollBottom();
          });
        }, 5000);
      }
    },

    scrollBottom() {
      this.$nextTick(() => {
        const el = document.getElementById('log-container');
        if (el) el.scrollTop = el.scrollHeight;
      });
    },

    lineColor(line) {
      return {
        ERROR: 'text-red-400',
        WARN: 'text-amber-400',
        INFO: 'text-slate-300',
        DEBUG: 'text-slate-500',
        TRACE: 'text-slate-500',
      }[this.parseLevel(line)] || (line.startsWith('[') ? 'text-slate-500' : 'text-slate-400');
    },

    levelBadge(level) {
      return {
        ERROR: 'bg-red-900/40 text-red-400',
        WARN: 'bg-amber-900/40 text-amber-400',
        INFO: 'bg-blue-900/30 text-blue-400',
        DEBUG: 'bg-slate-700/50 text-slate-400',
        TRACE: 'bg-slate-700/50 text-slate-500',
      }[level] || 'bg-slate-700/50 text-slate-400';
    },
  };
}
document.addEventListener('alpine:init', () => Alpine.data('logsPage', logsPage));
</script>
