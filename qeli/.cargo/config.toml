# Cross-target Cargo policy for the qeli crate.
#
# Keep this file free of global linker arguments: they are forwarded to every target,
# including Windows MSVC, Android and router cross-builds. Release artifacts are stripped
# portably by `strip = true` in Cargo.toml's [profile.release]. Target-specific flags, when
# unavoidable, belong in the explicit build recipe for that target.
#
# `-C target-feature=+aes` must not be added here. RustCrypto selects AES-NI at runtime via
# `cpufeatures`; forcing AES globally can produce SIGILL on x86-64 hosts where AES-NI is absent
# or masked. `make check-abi` verifies that runtime feature detection remains in use.
