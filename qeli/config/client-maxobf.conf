# ============================================================================
#  qeli client — MAXIMUM-OBFUSCATION server (pair with server-maxobf.conf)
#  Current format: flat-INI, single [qeli] section (same as a qeli:// link).
# ============================================================================
# The maxobf server runs with require_client_key_proof = true, so you MUST pin
# its static public key:
#   on the server:  qeli show-identity --config /etc/qeli/server-maxobf.conf
#   -> paste the 64-hex key into `key` below.
# Without the correct pinned key the server rejects this client.
# Import into the Android/desktop app via "Import" (accepts this INI or a qeli://
# link); the CLI uses it with `qeli client --config client-maxobf.conf`.
# ============================================================================

[qeli]
# host:port of the maxobf server
server = 10.66.116.10:443
proto = tcp
# must be a user defined on the maxobf server (server-maxobf.conf ships [user:client1])
user = client1
# Placeholder, like every other example here — `testpass123` used to sit on this line, and
# the users.conf sample shipped a hash that verified it. (Audit 2026-08-04.)
pass = changeme
# server-maxobf.conf carries the tunnel in genuine HTTP/2 inside REALITY TLS 1.3;
# the client MUST use reality-tls (needs key + reality_sid + sni).
mode = reality-tls
# REALITY short_id — must be one the server accepts (server-maxobf.conf short_ids).
reality_sid = 7e78a17ad41f1004
# pinned server static public key (REQUIRED here) — from `qeli show-identity`
key = PASTE_64_HEX_KEY_FROM_qeli_show-identity
# H-1: bind session keys to the server identity (Noise-IK). On by default since 0.7.1
# and the maxobf server runs it too; kept explicit here for clarity. Needs the real
# pinned key above. (Set false only to talk to a legacy 0.7.0 maxobf server.)
bind_static = true
# SNI must match the server's reality_proxy target
sni = www.microsoft.com
# Accept the authenticated server's IPv4+IPv6 network plan; use required to refuse
# IPv4-only downgrade, or off to request IPv4 only.
ipv6 = auto

[logging]
level = info
