# ============================================================================
#  qeli — MAXIMUM-OBFUSCATION server profile (flat-INI)
# ----------------------------------------------------------------------------
#  Stealth stack: genuine TLS 1.3 + HTTP/2 REALITY carrier (probes are bridged to
#  a real site) + pinned server identity + randomized H2 batching + Poisson cover.
#  Comments must stay on their OWN line (inline comments are not stripped).
#
#  The fd71:e1:8000::/48 ULA site prefix below is an example. Replace it with a
#  deployment-unique RFC4193 fdxx:xxxx:xxxx::/48 before manual deployment; the
#  one-shot installer and panel Quick Start randomize it automatically.
#
#  Deploy: put at /etc/qeli/server-maxobf.conf, print the key with
#  `qeli show-identity --config ...`, pin it on clients (key = ...), start.
# ============================================================================

[auth]
# Users live in a separate file (add them with `qeli add-client <name>`).
users_file = /etc/qeli/users.conf
# clients MUST pin the server key; unpinned clients are rejected
require_client_key_proof = true
# H-1: bind the data-plane keys to this server's static identity (Noise-IK). ON by
# default since 0.7.1 — only clients that pin the key and run H-1 (the default) can
# connect. Set false to interoperate with a legacy 0.7.0 client fleet.
bind_static_to_session = true

[logging]
level = info
file = /var/log/qeli/server.log

[profile:maxobf]
bind.address = 0.0.0.0
bind.port = 443
bind.transport = tcp
# Session roaming is experimental and safely disabled in shipped profiles.
roaming.enabled = false
roaming.grace_secs = 30
roaming.max_orphaned = 256
roaming.max_orphan_bytes = 67108864

tun.name = vpn0
tun.address = 10.9.0.1
tun.ip_mode = dual
tun.ipv6_address = fd71:e1:8000:101::1
tun.mtu = 1400
pool.cidr = 10.9.0.0/24
pool.ipv6.cidr = fd71:e1:8000:101::/64
routing.forward_private = true
routing.nat.enabled = true
routing.ipv6.mode = nat66
routing.ipv6.interface =
# in-tunnel DNS proxy (gateway IP, reachable in-tunnel) -> public upstream
dns.enabled = true
dns.listen = 10.9.0.1
dns.listen_ipv6 = fd71:e1:8000:101::1
dns.upstream = 1.1.1.1, 2606:4700:4700::1111
obf.mode = reality-tls
# This profile uses the genuine HTTP/2 carrier inside REALITY TLS. AmneziaWG-style
# junk (obf.awg.*) is obfs-only and does not apply here; use a separate obfs profile
# when compatibility with that masking is required.
# keep SNI identical to the REALITY target so a probe and a real client match
obf.tls.server_name = www.microsoft.com
# NOTE: obf.tls.session_id / key_share_entropy_bytes used to be set here, but nothing
# ever read them (found by `qeli check-config`). The REALITY token in the ClientHello
# session_id comes from reality_proxy.short_ids below.
obf.tls.reality_proxy.enabled = true
obf.tls.reality_proxy.target = www.microsoft.com
obf.tls.reality_proxy.target_port = 443
# short_ids accepted from clients (hex, <=8 bytes); a client presents one in reality_sid
obf.tls.reality_proxy.short_ids = 7e78a17ad41f1004
# real_tls = true -> authenticated clients are terminated inside a GENUINE TLS 1.3
# session (true reality-tls). Pair with clients on mode = reality-tls.
obf.tls.reality_proxy.real_tls = true
# handrolled = true (default) borrows the target's cert chain and mirrors its
# ServerHello/JA3S shape. This narrows differences but is not full browser/Xray parity;
# false falls back to rustls (self-signed, weaker camouflage).
obf.tls.reality_proxy.handrolled = true
# ms to peek the ClientHello before classifying client vs probe (raise for slow links)
obf.tls.reality_proxy.peek_timeout_ms = 1500
obf.padding.enabled = true
obf.padding.randomize = true
obf.padding.probability = 1.0
obf.padding.min_bytes = 40
obf.padding.max_bytes = 400
obf.heartbeat.enabled = false
obf.heartbeat.interval_ms = 15000
obf.heartbeat.data_size_bytes = 64
obf.heartbeat.jitter_ms = 5000
obf.quic.enabled = false
# flow shaping (idle cover; DPI-AUDIT 6.1/6.2). Max-obf posture: ON — an idle
# tunnel emits Poisson-gapped cover (empty encrypted records the peer drops, NOT
# wire-breaking) instead of the fixed heartbeat it replaces, killing the beacon +
# dead-air tells. Zero added latency; costs only idle bandwidth (budget below).
obf.traffic_shaping.enabled = true
obf.traffic_shaping.idle_gap_mean_ms = 700
obf.traffic_shaping.idle_gap_min_ms = 40
obf.traffic_shaping.idle_gap_max_ms = 6000
obf.traffic_shaping.budget_bytes_per_sec = 16384
obf.traffic_shaping.min_size = 64
obf.traffic_shaping.max_size = 1024
# STEALTH (rate-caps the data plane + cover-under-load → not a line-rate bulk
# download; TCP-only). Trades throughput for passability — opt-in, off here.
obf.traffic_shaping.stealth = false
obf.traffic_shaping.stealth_rate_mbps = 2
# Transport-independent PACKET_MUX_V1 morphology (all TCP/UDP modes).
obf.recordizer.policy = prefer
obf.recordizer.batch.delay_min_ms = 2
obf.recordizer.batch.delay_max_ms = 8
obf.recordizer.batch.max_packets = 16
obf.recordizer.batch.max_queue_bytes = 262144
obf.recordizer.record.max_payload_bytes = 0
obf.recordizer.record.small_min_ratio = 0.25
obf.recordizer.record.small_max_ratio = 0.875
obf.recordizer.record.full_probability = 0.72
obf.recordizer.fragment.enabled = true
obf.recordizer.fragment.reassembly_timeout_ms = 3000
obf.recordizer.fragment.max_inflight_packets = 64
obf.recordizer.fragment.max_reassembly_bytes = 4194304
obf.recordizer.fragment.max_fragments_per_packet = 64


perf.tcp.nodelay = true
perf.tcp.keepalive_secs = 30
perf.connection.max_clients = 64
perf.connection.handshake_timeout_secs = 10
perf.connection.idle_timeout_secs = 0

# Users are defined in the separate auth.users_file (see [auth] above) — add them
# with `qeli add-client <name> --config /etc/qeli/server-maxobf.conf`.
