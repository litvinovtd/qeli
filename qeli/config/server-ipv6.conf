# ============================================================================
# qeli dual-stack server example (flat INI)
# ----------------------------------------------------------------------------
# This profile carries IPv4 and IPv6 inside one tunnel and accepts an outer
# connection over either family. Replace the example ULA /64 with a unique ULA
# for your deployment; do not copy the same prefix to several VPN sites.
#
# NAT66 is the portable first-start mode for a VPS. If the upstream routes a
# global prefix to this host, use routing.ipv6.mode = route instead and arrange
# that routed prefix on the uplink. qeli does not implement NAT64/DNS64: use the
# dual mode below when clients must reach both IPv4-only and IPv6-only services.
# ============================================================================

[auth]
users_file = /etc/qeli/users.conf
require_client_key_proof = false
bind_static_to_session = true

[web]
enabled = false

[logging]
level = info

[profile:dual]
enabled = true

# Outer carrier: independent IPv4 and IPv6 listeners for the same profile.
bind.address = 0.0.0.0
bind.port = 443
bind.transport = tcp
listen = [::]:443

# Inner dual-stack tunnel. L3 TUN clients receive host prefixes (/32 and /128)
# while the server keeps the allocation/on-link prefixes below.
tun.ip_mode = dual
tun.name = vpn0
tun.address = 10.19.0.1
tun.ipv6_address = fd71:e1:19::1
tun.mtu = 1400
tun.device_type = tun
tun.queues = 0

pool.cidr = 10.19.0.0/24
pool.ipv6.cidr = fd71:e1:19::/64
# pool.exclude = 10.19.0.2
# pool.ipv6.exclude = fd71:e1:19::2
# pool.reservation.alice = 10.19.0.100
# pool.ipv6.reservation.alice = fd71:e1:19::100

routing.client_to_client = false
routing.forward_private = true
routing.nat.enabled = true
# Empty means auto-detect the IPv4 default-route interface.
routing.nat.interface =
routing.ipv6.mode = nat66
# Empty means auto-detect the IPv6 default-route interface.
routing.ipv6.interface =

# The built-in resolver listens on both addresses and pushes both in the
# authenticated NetworkPlan. Keep each listener equal to its TUN gateway.
dns.enabled = true
dns.listen = 10.19.0.1
dns.listen_ipv6 = fd71:e1:19::1
dns.port = 53
dns.upstream = 1.1.1.1, 2606:4700:4700::1111

dhcp.enabled = false

obf.mode = fake-tls
obf.tls.server_name = www.cloudflare.com
obf.quic.enabled = false

perf.connection.max_clients = 64
perf.connection.handshake_timeout_secs = 10
perf.connection.idle_timeout_secs = 0

# Add users with:
# qeli add-client alice --config /etc/qeli/server.conf
