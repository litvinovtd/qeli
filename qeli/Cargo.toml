[package]
name = "qeli"
version = "0.8.0"
edition = "2021"
description = "Quick Easy Link IP"
authors = ["qeli"]

[lib]
# Keep the Rust library target distinct from the `qeli` executable: MSVC emits one PDB per
# target name, so identical names collide at qeli.pdb. Release recipes rename only the final
# native cdylib back to the stable public qeli.dll/libqeli.{so,dylib} ABI filenames.
name = "qeli_core"
path = "src/lib.rs"
# rlib for the binary/tests; cdylib/staticlib for the realtls FFI on Android/Windows.
crate-type = ["rlib", "cdylib", "staticlib"]

# Full daemon (server + web + realtls termination + CLI). The default; what the
# server, CI, and the Android/Win/Mac FFI cdylib have always built.
[[bin]]
name = "qeli"
path = "src/main.rs"
required-features = ["server", "client"]

# Standalone client binary for routers (Keenetic / Entware). Built ONLY under the
# off-by-default `client-bin` feature, so normal builds never compile it — keeping
# server/CI/FFI builds byte-identical to before. See docs/*/reference/KEENETIC-PORT.md.
# NB: lives at src/client_main.rs (NOT src/bin/) because .gitignore's `**/bin/`
# would otherwise exclude it from git/CI.
[[bin]]
name = "qeli-client"
path = "src/client_main.rs"
required-features = ["client-bin"]

# Generator for the shared cross-language KAT fixtures in conformance/. Built ONLY
# under the off-by-default `conformance-gen` feature, so normal builds are untouched.
# NB: also lives outside src/bin/ — `.gitignore`'s `**/bin/` would exclude it from git.
[[bin]]
name = "gen-conformance"
path = "src/gen_conformance_main.rs"
required-features = ["conformance-gen"]

# Permanent release-mode PacketCodec microbenchmark. Kept behind an off-by-default feature so
# normal server/client artifacts do not gain another entry point; CI enables it explicitly.
[[bin]]
name = "packet-codec-bench"
path = "src/packet_bench_main.rs"
required-features = ["packet-bench"]

[features]
default = ["server", "client"]
# Server side pulls the only MIPS-incompatible deps (rustls/ring via rcgen) plus
# the web stack. A client-only build (`--no-default-features --features client-bin`)
# excludes all of these and cross-compiles to mipsel/aarch64.
# Every server build includes session roaming: shipped profiles and Quick Start enable it.
server = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:rcgen", "dep:axum", "dep:axum-server", "dep:tower", "dep:qrcode", "dep:rustls-pemfile", "experimental-roaming"]
client = []
# Standard standalone and FFI clients carry the same roaming state machine. Runtime
# capability negotiation still falls back safely on unsupported platforms and peers.
client-bin = ["client", "experimental-roaming"]
# Swap the server binary's global allocator to jemalloc. Opt-in + OFF by default:
# only the Linux server/deb release build enables it (`--features jemalloc`). The
# cross-platform FFI cdylib (Win/Mac/Android) and the MIPS/musl router client never
# turn it on, so `tikv-jemalloc-sys` (no Windows backend, finicky on musl) is never
# compiled for them. See docs on the glibc arena-retention RSS plateau.
jemalloc = ["dep:tikv-jemallocator"]
# Builds the shared-KAT generator (`gen-conformance`). Off by default so normal
# server/CI/FFI builds never compile it and stay byte-identical; CI turns it on only
# for the fixture-freshness check.
conformance-gen = []
# Builds the deterministic PacketCodec benchmark/gate used by CI and lab comparisons.
packet-bench = []
# Marks a build whose artefact is the FFI cdylib (Android/Windows/macOS/iOS clients).
#
# It carries no code of its own — it exists so `protocol/realtls/ffi.rs` can assert at
# COMPILE TIME that the panic strategy really is `unwind`. Every catch_unwind guard in the
# FFI/JNI layer is inert under `panic = "abort"`, and the only thing keeping the cdylib
# builds on unwind was an env var in a handful of scripts plus a comment here — one of those
# scripts (build_so_p3.py) had silently lost it. With this feature the invariant fails the
# BUILD instead of failing quietly at runtime, where a panic parsing bytes from an untrusted
# server takes down the whole host app. (Audit 2026-08-04.)
ffi-cdylib = []
# Experimental whole-client control-plane ABI. It deliberately implies the existing
# ffi-cdylib panic contract: every exported entry point catches unwinds, so a release
# build with panic=abort must fail at compile time instead of making those guards inert.
transport-core-ffi = ["ffi-cdylib", "client", "experimental-roaming"]
# Internal compile-time gate retained for minimal/core experiments. All supported server,
# standalone-client and FFI build entry points above include it. Handover is authenticated and
# still requires the platform adapter and peer to negotiate the complete ROAMING_PATH contract.
experimental-roaming = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "signal", "sync", "macros", "process"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom", "zeroize"] }
chacha20poly1305 = "0.11"
chacha20 = "0.10"
# `zeroize` here is aes-gcm's implicit optional-dep feature. Be precise about what it
# buys (audit 2026-07-27): it guards exactly one statement — `ghash_key.zeroize()` in
# `From<Aes>`, wiping the 16-byte GHASH subkey temporary. It does NOT reach the expanded
# AES round keys: those live in the `aes` crate's cipher object, and `aes` 0.8.4 exposes
# no portable `zeroize` feature (its zeroize dep is gated on the aarch64 armv8 backend).
# So the key-schedule residue documented as accepted debt in THREAT-MODEL.md §4 is real
# and this flag does not close it — keep both statements in sync if the crate changes.
aes-gcm = { version = "0.10", features = ["zeroize"] }
# Pure-Rust ML-KEM-768 (FIPS 203) for the X25519MLKEM768 post-quantum key share
# in the ClientHello — fingerprint parity with current Chrome. No C deps (unlike
# aws-lc-rs), so it cross-compiles to the Android/Windows/macOS FFI clients.
# `getrandom` enables `generate_keypair()` (OS RNG) — no rand_core version coupling.
ml-kem = { version = "0.3", features = ["getrandom"] }
sha2 = "0.11"
hkdf = "0.13"
hmac = "0.13"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
bytes = "1"
h2 = "0.4"
http = "1"
libc = "0.2"
# Drop-in AtomicU64 etc. that work on 32-bit targets without native 64-bit atomics
# (mipsel Keenetic routers). Maps to native instructions on aarch64/x86_64 — zero
# cost there; lock-based fallback only where the target lacks the instruction.
portable-atomic = "1"
# jemalloc as the server binary's global allocator (behind the off-by-default
# `jemalloc` feature). glibc retains freed arenas → the worker RSS plateaus ~180 MB
# under handshake churn; jemalloc fragments far less and returns pages to the OS via
# decay, keeping RSS bounded (~40-60 MB). Optional so non-server targets never build
# jemalloc-sys (no Windows/MSVC backend). Linux-only in practice (the binary is too).
tikv-jemallocator = { version = "0.7", optional = true }
mio = { version = "1", features = ["os-poll", "os-ext"] }
# SO_REUSEPORT UDP sockets for the multi-worker UDP data plane (safe sockaddr
# handling vs hand-rolled libc). Already in the dep tree via tokio/mio.
socket2 = { version = "0.6", features = ["all"] }

# Web admin stack — server-only (feature = "server"). `ring` (pulled via rcgen/
# rustls below) has no MIPS backend, so these stay out of the client-only build.
axum = { version = "0.8", features = ["macros"], optional = true }
# HTTPS for the panel on a public bind. `tls-rustls-no-provider` (NOT `tls-rustls`)
# so it does NOT pull aws-lc-rs (needs cmake — the lab has none); we supply the
# `ring` provider ourselves via the existing rustls `ring` feature.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
tower = { version = "0.5", optional = true }
# Load PEM cert/key (operator-provided or persisted self-signed) for the panel TLS.
rustls-pemfile = { version = "2", optional = true }
# CIDR parsing is part of the base config validation surface: even no-feature parser/fuzz
# builds validate client LAN CIDRs, while server builds also use it for panel allowlists.
ipnet = "2"
base64 = "0.22"
# Pure-Rust QR generation for the web UI share/QR feature (SVG output, no JS/CDN).
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }

# Real TLS 1.3 server-side termination for REALITY (M3). `ring` provider only
# (the lab has no cmake for aws-lc-rs). The client side is hand-rolled (no rustls),
# so these are server-only (feature = "server") — `ring` is the lone MIPS blocker
# and it lives entirely behind this gate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
# Mozilla root bundle for verifying outbound TLS (Telegram API / webhook notify).
# Data-only crate; server-side (notifications) only.
webpki-roots = { version = "1.0", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }

[dev-dependencies]
# ServiceExt::oneshot for driving real requests through a Router in tests (tower's
# default feature set omits `util`). Test-only — never in the release binary.
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "android")'.dependencies]
# JNI bridge for the Android client (A4). Host/Windows use the plain C ABI (ffi.rs).
jni = { version = "0.21", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
# Server binary: abort on panic (smaller, and a data-plane panic should not unwind).
# NOTE: the client FFI cdylib (libqeli.so/.dll/.dylib, realtls C ABI) is built with an
# env override CARGO_PROFILE_RELEASE_PANIC=unwind (see scripts/build_*_libs*.py,
# build_android_so_11.py, qeli-mac/build_dylib.sh) so the catch_unwind guards in
# protocol/realtls/ffi.rs are effective — under abort they are inert, and a panic while
# parsing untrusted server/on-path bytes would abort the host app (JVM/.NET) instead of
# returning an error. The same override protects transport_core/jni.rs when the Android
# whole-client shadow adapter is enabled. Keep both in sync.
panic = "abort"
