[auth]
require_client_key_proof = true
bind_static_to_session = false
brute_force.enabled = false
brute_force.max_attempts = 9
brute_force.window_secs = 120
brute_force.lockout_secs = 600

[logging]
level = debug
file = /tmp/qeli-rt.log
format = json
time_format = rfc3339

[web]
