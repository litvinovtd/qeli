# qeli reality-tls server — ОСНОВНОЙ профиль: REALITY TLS 1.3 + настоящий HTTP/2
# на :443 по умолчанию. Сервер терминирует TLS (hand-rolled терминатор с
# cert-borrowing — см. handrolled ниже; rustls — только при handrolled=false),
# затем несёт приватный qeli-поток в полноценной двунаправленной H2-сессии.
#
# DPI-эффект: ALPN=h2, настоящие SETTINGS/HEADERS/DATA, randomized batching и нет
# второго fake-TLS handshake или соответствия «один IP-пакет = одна TLS-запись».
#
# Это дефолт. Дополнительные профили (другие порты/режимы) при необходимости
# добавляются вручную отдельными секциями [profile:...].
#
# ULA site-prefix fd71:e1:8000::/48 ниже — только пример. При ручном развёртывании
# замените его на уникальный RFC4193 fdxx:xxxx:xxxx::/48; one-shot installer и
# Quick Start панели генерируют такой префикс автоматически.
#
# Миграция: сначала обновите сервер. Новый сервер принимает текущий H2 и прежний
# Reality carrier; новый клиент использует только H2 и не делает downgrade. Bare
# fake-tls остаётся отдельным режимом — при необходимости держите его на другом
# профиле/порту. Установленным GUI-клиентам нужен новый пакет с пересобранным ядром.

[auth]
# Пользователи хранятся в отдельном файле (добавляй через `qeli add-client`).
users_file = /etc/qeli/users.conf
require_client_key_proof = true
# H-1: bind data-plane keys to the server static identity (Noise-IK). ON by default
# since 0.7.1 — clients must pin the key and run H-1 (the default). reality-tls
# already mandates a pinned key, so this is a clean fit. false = legacy 0.7.0 compat.
bind_static_to_session = true

[logging]
level = debug
file = /var/log/qeli/server.log

[profile:maxobf]
identity_key = /etc/qeli/identity/maxobf.key
bind.address = 0.0.0.0
bind.port = 443
bind.transport = tcp
# Session roaming is experimental and safely disabled in shipped profiles.
roaming.enabled = false
roaming.grace_secs = 30
roaming.max_orphaned = 256
roaming.max_orphan_bytes = 67108864

tun.name = vpn0
tun.address = 10.9.0.1
tun.ip_mode = dual
tun.ipv6_address = fd71:e1:8000:103::1
tun.mtu = 1400
tun.device_type = tun
pool.cidr = 10.9.0.0/24
pool.ipv6.cidr = fd71:e1:8000:103::/64
pool.exclude = 10.9.0.1
routing.forward_private = true
routing.nat.enabled = true
routing.ipv6.mode = nat66
routing.ipv6.interface =
dns.enabled = true
dns.listen = 10.9.0.1
dns.listen_ipv6 = fd71:e1:8000:103::1
dns.upstream = 1.1.1.1, 2606:4700:4700::1111
obf.mode = reality-tls
obf.tls.server_name = www.microsoft.com
obf.tls.reality_proxy.enabled = true
obf.tls.reality_proxy.target = www.microsoft.com
obf.tls.reality_proxy.target_port = 443
# >>> Ключевые строки REALITY real-TLS: <<<
obf.tls.reality_proxy.real_tls = true
# handrolled=true включает cert-borrowing: сервер одалживает цепочку сертификата
# target'а и зеркалит форму ServerHello/JA3S. Это снижает расхождения, но не означает
# полного паритета с браузером, Xray или target по всем TLS/H2/тайминговым признакам.
obf.tls.reality_proxy.handrolled = true
# short_ids: allow-лист 8-байтовых (16 hex) идентификаторов «своих». СГЕНЕРИРУЙТЕ
# СВОЙ перед продом (напр. `openssl rand -hex 8`); этот — пример из тестов.
obf.tls.reality_proxy.short_ids = REPLACE_WITH_OWN_SHORT_ID
obf.padding.enabled = true
obf.padding.randomize = true
obf.padding.probability = 1.0
obf.padding.min_bytes = 40
obf.padding.max_bytes = 400
obf.heartbeat.enabled = false
obf.heartbeat.interval_ms = 15000
obf.heartbeat.data_size_bytes = 64
obf.heartbeat.jitter_ms = 5000
obf.traffic_shaping.enabled = true
obf.traffic_shaping.idle_gap_mean_ms = 700
obf.traffic_shaping.idle_gap_min_ms = 40
obf.traffic_shaping.idle_gap_max_ms = 6000
obf.traffic_shaping.budget_bytes_per_sec = 16384
obf.traffic_shaping.min_size = 64
obf.traffic_shaping.max_size = 1024
obf.anti_fingerprinting.enabled = true
obf.anti_fingerprinting.add_jitter_to_handshake = true
obf.quic.enabled = false
# Стрим-бондинг: несколько параллельных reality-tls соединений → один туннель,
# обходит потолок одиночного TCP-over-TCP (см. docs/*/manuals/CONFIG.md). Только для TCP-режимов.
# true = включить бондинг
obf.multipath.enabled = false
# жёсткий потолок потоков на сессию (сервер энфорсит)
obf.multipath.max_streams = 4
# false = открыть ровно max_streams; true = авто-подбор по скорости
obf.multipath.adaptive = false
# Transport-independent PACKET_MUX_V1 morphology; not specific to REALITY/H2.
obf.recordizer.policy = prefer
obf.recordizer.batch.delay_min_ms = 2
obf.recordizer.batch.delay_max_ms = 8
obf.recordizer.batch.max_packets = 16
obf.recordizer.batch.max_queue_bytes = 262144
obf.recordizer.record.max_payload_bytes = 0
obf.recordizer.record.small_min_ratio = 0.25
obf.recordizer.record.small_max_ratio = 0.875
obf.recordizer.record.full_probability = 0.72
obf.recordizer.fragment.enabled = true
obf.recordizer.fragment.reassembly_timeout_ms = 3000
obf.recordizer.fragment.max_inflight_packets = 64
obf.recordizer.fragment.max_reassembly_bytes = 4194304
obf.recordizer.fragment.max_fragments_per_packet = 64


perf.tcp.nodelay = true
perf.tcp.keepalive_secs = 30
perf.tun.read_buffer_size = 65535
perf.connection.max_clients = 64
perf.connection.handshake_timeout_secs = 10
perf.connection.idle_timeout_secs = 0

# Пользователи хранятся в ОТДЕЛЬНОМ файле (auth.users_file = /etc/qeli/users.conf,
# см. [auth] выше). Создай их через:
#   qeli add-client <username> --config server-reality.conf
# add-client допишет юзера в этот файл (инлайн [user:*] в конфиге НЕ нужен — и если
# добавить, то auth.users_file будет проигнорирован). Шаблон намеренно без юзеров,
# чтобы его нельзя было задеплоить «как есть» с известным паролем.
