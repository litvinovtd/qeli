name: CI

on:
  push:
    paths:
      - 'qeli/**'
      # The desktop clients' SHARED crypto/protocol (PacketCodec, HKDF, ChaCha20,
      # ObfsStream, realtls glue) lives here and is ProjectReference'd by both
      # qeli-win and qeli-mac — without it a shared-only change shipped with no CI
      # at all.
      - 'qeli-shared/**'
      - 'qeli-android/**'
      - 'qeli-win/**'
      - 'qeli-mac/**'
      # Added with the ios-build / native-libs jobs — a job whose paths filter never
      # matches is worse than no job: it shows up green having run nothing. (R-05/R-06)
      - 'qeli-ios/**'
      - 'native-libs/**'
      - '.github/workflows/ci.yml'
      # The docs job gates these, and without them a docs-only change ran NO CI at
      # all: the gate existed but could never be triggered by the thing it guards.
      - 'docs/**'
      - 'scripts/**'
      - 'conformance/**'
      - '*.md'
      # The `shellcheck` job lints the two root-level installer scripts — without
      # them here it would be a gate that its own subject can never trigger.
      # (Audit 2026-07-27, G2)
      - '*.sh'
  pull_request:
    paths:
      - 'qeli/**'
      - 'qeli-shared/**'
      - 'qeli-android/**'
      - 'qeli-win/**'
      - 'qeli-mac/**'
      # Added with the ios-build / native-libs jobs — a job whose paths filter never
      # matches is worse than no job: it shows up green having run nothing. (R-05/R-06)
      - 'qeli-ios/**'
      - 'native-libs/**'
      - '.github/workflows/ci.yml'
      # The docs job gates these, and without them a docs-only change ran NO CI at
      # all: the gate existed but could never be triggered by the thing it guards.
      - 'docs/**'
      - 'scripts/**'
      - 'conformance/**'
      - '*.md'
      - '*.sh'
  workflow_dispatch:
  schedule:
    # Nightly continuous fuzzing (the `fuzz-nightly` job; other jobs also run as a
    # free health check). 03:17 UTC — off the top of the hour to dodge scheduler load.
    - cron: '17 3 * * *'

defaults:
  run:
    working-directory: qeli

jobs:
  # Hard gate: the committed native libraries (.so/.dll/.dylib) must match their
  # manifest. They are opaque blobs whose diff no reviewer can read, so without this a
  # swapped binary passes review unnoticed; the manifest also pins each canonical copy to
  # the copy the build stack actually consumes, so the two cannot drift apart and ship a
  # stale library. Cheap (hashing ~19 MB) and needs no toolchain. (R-06)
  native-libs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .          # the script expects the repo root, not qeli/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify native library hashes
        run: bash native-libs/verify.sh
      # verify.sh only proves the two copies of each library agree with each other. It
      # cannot tell whether they correspond to the Rust source beside them — and that is
      # the failure that actually happened: the cores were built from the 0.7.12 source and
      # stayed put while qeli/src moved on, so every GUI client shipped an older
      # realtls/FFI core than the tree described, invisibly (a .so has no readable diff).
      # (Audit 2026-07-27, G1/I4.)
      - name: Native cores match the source in this tree
        run: python3 native-libs/provenance.py --check

  # Hard gate: the crate is Linux-only (TUN/TAP via libc), so build + the full
  # unit-test suite must be green. This is what blocks a merge.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: qeli
      - name: Build
        run: cargo build --bin qeli --release
      - name: Test
        run: cargo test --workspace
      # The shared cross-language KAT fixtures (conformance/*.json) are GENERATED from the
      # Rust canon. Without this gate they can silently fall out of step with the code they
      # pin: the other three implementations would keep passing against a stale table and
      # believe they still agree. Regenerates in memory and fails on any drift.
      - name: Conformance fixtures are up to date
        run: cargo run --features conformance-gen --bin gen-conformance -- --check

  # Hard gate: build and INSTALL the artifact that actually ships. (Audit 2026-07-27, G2)
  #
  # `build-test` above runs a plain `cargo build --release` on the runner, which proves
  # the code compiles and nothing else. The published artifact is a .deb produced by
  # `make deb-portable` (cargo-zigbuild against a pinned glibc ABI) and NOTHING in CI
  # ever built it, ran `check-abi`, or installed it anywhere. That gap is exactly how
  # 0.7.8–0.7.11 shipped requiring GLIBC_2.39 while declaring `Depends: libc6 (>= 2.28)`:
  # apt installed them without a word and they died at exec on Ubuntu 22.04.
  #
  # So: build it the way the release does, then prove it twice —
  #   • debian:10 (glibc 2.28, the declared floor) — unpack and RUN the binary. No apt,
  #     so an EOL archive repo can never make this step fail for an unrelated reason.
  #   • ubuntu:22.04 — a real `apt-get install`, which also exercises the dependency
  #     list and the postinst, then runs the installed binary.
  deb-package:
    runs-on: ubuntu-latest
    # Repo root: the Makefile lives in qeli/debian and the containers mount the tree.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: qeli
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      # deb-portable itself runs check-abi (glibc floor + the AES-NI baseline check),
      # so a binary that outgrew either one fails right here.
      - name: Build the portable .deb (the exact release recipe)
        run: make -C qeli/debian deb-portable
      - name: Locate the package
        id: pkg
        run: |
          set -euo pipefail
          deb=$(ls qeli/debian/qeli_*_amd64.deb | head -n1)
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          ls -la "$deb"
      - name: Runs on the declared glibc floor (debian:10 = glibc 2.28)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w debian:10 sh -c '
            set -e
            dpkg -x "$0" /tmp/x
            /tmp/x/usr/bin/qeli version
          ' "${{ steps.pkg.outputs.deb }}"
      - name: Installs and runs on an old supported distro (ubuntu:22.04)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w ubuntu:22.04 sh -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends "./$0"
            qeli version
          ' "${{ steps.pkg.outputs.deb }}"

  # Hard gate: the two installer scripts are the ONLY thing between a fresh VPS and a
  # running server, they run as root, and nothing ever linted them. (Audit 2026-07-27, G2)
  # The gate is severity `warning` and above — that is a threshold, not an exemption:
  # a second, non-gating pass prints every info/style suggestion so they stay visible.
  shellcheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
      - name: shellcheck (gate — warning and above)
        run: shellcheck -S warning install-qeli-server.sh update-qeli-server.sh
      - name: shellcheck (advisory — every severity)
        run: shellcheck install-qeli-server.sh update-qeli-server.sh || true

  # Hard gate: the tree was normalized (one-time `cargo fmt` + clippy pass), so
  # formatting and lint cleanliness are now enforced. `-D warnings` fails the
  # build on any clippy warning.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: qeli
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  # Documentation gate: no broken links, no orphaned pages, ru/eng file parity, and
  # every INI key the server actually emits is covered by CONFIG.md in BOTH languages
  # (the last one is what let a phantom key live in one language only).
  docs:
    runs-on: ubuntu-latest
    # The workflow-level default is `working-directory: qeli` (every other job builds
    # the crate). Without this override these steps look for qeli/scripts/... and die
    # with exit 2 — a gate that fails for the wrong reason and proves nothing.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: docs checks
        run: python3 scripts/check_docs.py
      # Needs the tags: the "these docs describe X" banner tracks the newest v* tag,
      # and actions/checkout fetches none by default.
      - name: fetch tags
        run: git fetch --tags --force
      - name: version consistency
        run: python3 scripts/sync_version.py

  # HARD gates: the client apps must at least compile. None of these carry
  # `continue-on-error`, so a broken client build blocks the merge — which is the intent.
  # They were labelled "soft gate" here while behaving as hard ones; the only genuinely
  # soft job in this file is `fuzz-smoke` (nightly toolchain). Keep the label and the
  # mechanics in step: a comment that misstates whether a gate blocks is how people come
  # to believe a red job is expected. (Audit 2026-07-27, Z5.)
  #
  # The native realtls core (libqeli.so / qeli.dll / libqeli.dylib) is committed under each
  # client, so these jobs only need the platform toolchain — they do NOT cross-build Rust.
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Assemble debug APK
        working-directory: qeli-android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      # The JVM unit tests (BackupCryptoTest, ObfsStreamTest) already existed but
      # nothing ran them — assembleDebug only proves it compiles.
      - name: Unit tests (JVM)
        working-directory: qeli-android
        run: ./gradlew --no-daemon testDebugUnitTest
      # `assembleDebug` compiles the DEBUG variant, which has different rules: release-only
      # problems (missing ProGuard keep-rules, manifest issues, API-level misuse flagged by
      # lint) never showed up in CI at all. lintRelease covers the variant users install.
      # `-Dlint.baselines.continue=true` so an existing baseline file doesn't abort the run.
      # (R-05)
      - name: Android lint (release variant)
        working-directory: qeli-android
        run: ./gradlew --no-daemon lintRelease -Dlint.baselines.continue=true

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build QeliWin (Release)
        working-directory: qeli-win
        run: dotnet build QeliWin/QeliWin.csproj -c Release
      # `dotnet build` only proved it compiles. The headless `selftest` verb checks the
      # SHARED crypto/protocol (X25519, HKDF, ChaCha20-Poly1305, PacketCodec incl.
      # counter/replay, ObfsStream, INI/qeli:// parsing) — no network, no admin.
      # Invoked through the dotnet host on the managed DLL: the .exe manifest demands
      # elevation, which the self-test itself does not need.
      - name: Self-test QeliWin (headless crypto/codec/parse round-trips)
        working-directory: qeli-win
        run: dotnet exec QeliWin/bin/Release/net10.0-windows/win-x64/QeliWin.dll selftest

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build QeliMac (Release)
        working-directory: qeli-mac
        run: dotnet build QeliMac/QeliMac.csproj -c Release
      - name: Self-test QeliMac (headless crypto/codec/parse round-trips)
        working-directory: qeli-mac
        run: dotnet exec QeliMac/bin/Release/net10.0/QeliMac.dll selftest
      # Build BOTH macOS architectures explicitly. The utun ioctl P/Invoke has an
      # arch-conditional signature (Apple ARM64 passes the variadic arg on the stack,
      # x86_64 in a register — C-07), so the Intel path is a distinct code path that a
      # single default-RID build never compiles. Shipped builds are universal, so a break
      # here would only surface on a user's Intel Mac. (R-05)
      - name: Build both macOS RIDs (arm64 + Intel)
        working-directory: qeli-mac
        run: |
          dotnet build QeliMac/QeliMac.csproj -c Release -r osx-arm64
          dotnet build QeliMac/QeliMac.csproj -c Release -r osx-x64

  # iOS had NO CI at all: the Swift client (QeliCore crypto/protocol + the packet-tunnel
  # extension) could stop compiling and nothing would notice until a manual Xcode build.
  # The project is generated by XcodeGen from project.yml, so CI generates it the same way
  # the developer script does rather than committing a .xcodeproj. Simulator build + the
  # existing QeliIOSTests; no signing, so no certificates are needed. (R-05)
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # QeliCore/Native/Qeli.xcframework is .gitignore'd, so a clean checkout does NOT
      # have it — while project.yml requires it unconditionally. Without this step the
      # job could never build the product it claims to test; it died at project
      # generation instead. build_native.sh adds the iOS rustup targets itself.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: qeli
      - name: Build the native core (XCFramework, device + simulator)
        working-directory: qeli-ios
        run: sh build_native.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: qeli-ios
        # Invoke through `sh` instead of `./`: whether the executable bit survives depends
        # on how the file was committed (and on Windows checkouts it generally does not), so
        # `./generate_project.sh` fails with "Permission denied" for a reason that has
        # nothing to do with the code being tested.
        run: sh generate_project.sh
      - name: Build (iOS Simulator, no signing)
        working-directory: qeli-ios
        run: |
          set -euo pipefail
          xcodebuild build \
            -project QeliIOS.xcodeproj \
            -scheme QeliIOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Unit tests (QeliCore crypto/protocol)
        working-directory: qeli-ios
        run: |
          set -euo pipefail
          # Pick whatever iPhone simulator this runner image ships — hardcoding a model
          # breaks every time GitHub rolls the image forward.
          xcrun simctl list devices available -j > /tmp/sims.json
          dest=$(python3 -c "import json; d=json.load(open('/tmp/sims.json'))['devices']; print(next(x['udid'] for v in d.values() for x in v if 'iPhone' in x['name']))")
          echo "using simulator $dest"
          xcodebuild test \
            -project QeliIOS.xcodeproj \
            -scheme QeliIOS \
            -destination "id=$dest" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  # Soft-gate: клиент для роутера (Keenetic) кросс-компилируется под обе арки —
  # aarch64 (stable) и mipsel (tier-3: nightly + -Zbuild-std). Линкер/cc — zig через
  # cargo-zigbuild (OpenWrt SDK не нужен). Только сборка; рантайм проверяется на устройстве.
  # Арк-специфичные TUNSETIFF (тип/значение) и float-ABI mipsel видны ТОЛЬКО здесь, не на
  # x86-гейте build-test выше — этот job ловит молчаливую поломку кросс-сборки.
  keenetic-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            toolchain: stable
          - arch: mipsel
            target: mipsel-unknown-linux-musl
            toolchain: nightly
          # armv7 is a shipped OpenWrt target but was missing from the matrix, so a
          # 32-bit-only break could still slip through even though mipsel is covered.
          # Same soft-float / stable toolchain path as aarch64 (tier-2, no build-std).
          - arch: armv7
            target: armv7-unknown-linux-musleabihf
            toolchain: stable
          # x86_64-musl was missing while `qeli-openwrt/dist/qeli-client-openwrt-x86_64`
          # is PUBLISHED — a shipped artifact with no build gate at all. It is also the
          # only musl target where the x86-specific code paths get compiled against musl
          # rather than glibc. (Audit 2026-07-27, G2)
          - arch: x86_64-musl
            target: x86_64-unknown-linux-musl
            toolchain: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Per-arch toolchain bits
        run: |
          # mipsel is tier-3: no prebuilt std, so build-std needs rust-src. aarch64 and
          # armv7 are tier-2: install the prebuilt std target instead.
          if [ "${{ matrix.arch }}" = "mipsel" ]; then
            rustup component add rust-src
          else
            rustup target add ${{ matrix.target }}
          fi
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: qeli
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Cross-build qeli-client (${{ matrix.arch }})
        run: |
          if [ "${{ matrix.arch }}" = "mipsel" ]; then
            RUSTFLAGS='-C link-arg=-msoft-float' cargo zigbuild -Z build-std=std,panic_abort \
              --release --bin qeli-client --no-default-features --features client-bin \
              --target ${{ matrix.target }}
          else
            cargo zigbuild \
              --release --bin qeli-client --no-default-features --features client-bin \
              --target ${{ matrix.target }}
          fi
      - name: Artifact info
        run: file target/${{ matrix.target }}/release/qeli-client

  # Soft gate: build the fuzz harnesses and run a short smoke on each. Catches a
  # build break / API drift in the untrusted-input parsers (ClientHello, packet
  # codec, realtls record) and any crash reachable within the time budget. Not a
  # merge blocker — full fuzzing is run out-of-band (see qeli/fuzz/README.md).
  fuzz-smoke:
    runs-on: ubuntu-latest
    # The job as a whole stays soft: it runs on the NIGHTLY toolchain, so upstream drift
    # could otherwise block every merge for reasons unrelated to this code. But the part
    # that catches real regressions — do the harnesses still COMPILE against the parsers —
    # is gated per-step below. (R-04)
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: qeli
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Build first and report the outcome explicitly: an API drift that stops the
      # harnesses compiling is a genuine regression in the untrusted-input parsers, and
      # `continue-on-error` on the job would otherwise bury it. Annotated as an error in
      # the run summary even though the job is allowed to pass. (R-04)
      - name: Build the fuzz harnesses
        working-directory: qeli
        run: |
          set -euo pipefail
          if ! cargo +nightly fuzz build; then
            echo "::error::fuzz harnesses no longer build — the parser API drifted"
            exit 1
          fi
      - name: Smoke each target (30s)
        working-directory: qeli
        run: |
          for t in clienthello packet_decrypt realtls_record obfs_datagram quic udp_frag; do
            echo "=== fuzz $t ==="
            cargo +nightly fuzz run "$t" -- -max_total_time=30
          done

  # Continuous fuzzing: a longer nightly run of each target with a corpus persisted
  # across runs, so coverage accumulates (the push `fuzz-smoke` above is only a 30s
  # build-break check with no corpus). Per-target matrix runs in parallel; a crash
  # fails that target and uploads the reproducer as an artifact. Scheduled/manual only.
  fuzz-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [clienthello, packet_decrypt, realtls_record, obfs_datagram, quic, udp_frag]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: qeli
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Restore/seed corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Repo-root-relative (not affected by defaults.working-directory). A fresh
          # key each run + prefix restore-keys = an always-updating corpus cache.
          path: qeli/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }} (10 min)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
      - name: Upload crash reproducer
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: qeli/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # Surface known RustSec advisories in the dependency tree. This IS a hard gate — see the
  # note inside the job. (The preamble here used to say "Non-gating for now … promote once
  # the tree is triaged clean", contradicting the job it introduced, which had already been
  # promoted. Audit 2026-07-27, Z5.)
  security-audit:
    runs-on: ubuntu-latest
    # HARD GATE (R-04). Was `continue-on-error: true` with a note to promote it "once the
    # tree is triaged clean" — it now is: `cargo audit` reports 0 vulnerabilities, only one
    # allowed `unmaintained` warning (RUSTSEC-2025-0134, rustls-pemfile). A soft security
    # gate reports a new CVE into a log nobody reads, which is the same as not having one.
    # NB: cargo audit exits 0 on warnings and non-zero on VULNERABILITIES, so an
    # unmaintained-crate advisory still does not block a merge — only a real CVE does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: qeli
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
