name: release-build-and-attest

# The Linux package is built from the exact release tag in this job, validated, attested
# with GitHub OIDC, and only then uploaded. This is build provenance, not an attestation
# over bytes that arrived from a maintainer workstation.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and publish (e.g. v0.8.0)'
        required: true

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-build-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-package:
    # Prereleases publish the already qualified candidate bytes. Rebuilding here
    # would replace that package and its sealed checksums after publication.
    # Explicit manual runs and stable releases retain the CI build/attest path.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Admit exact tag, runtime certification and successful CI commit
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_tag.py --tag "$TAG" --require-ci --wait-ci 1800 --require-certification --github-output "$GITHUB_OUTPUT"

      - name: Validate common native legal resources before building
        run: python3 scripts/native_licenses.py

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.meta.outputs.rust_toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: qeli

      - name: Install the portable glibc build driver
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Build the release .deb from this tag
        run: |
          set -euo pipefail
          make -C qeli/debian clean
          make -C qeli/debian deb-portable

      - name: Locate and inspect the package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find qeli/debian -maxdepth 1 -type f -name 'qeli_*_amd64.deb' -print)
          test "${#packages[@]}" -eq 1
          deb="${packages[0]}"
          name="$(basename "$deb")"
          test "$name" = "qeli_${{ steps.meta.outputs.version }}_amd64.deb"
          dpkg-deb --info "$deb"
          echo "source=$deb" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the exact bytes to be published
        shell: bash
        run: |
          set -euo pipefail
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb -x "${{ steps.pkg.outputs.source }}" "$extracted"
          "$extracted/usr/bin/qeli" version
          python3 scripts/native_licenses.py --bundle "$extracted/usr/share/doc/qeli/licenses/rust"
          for name in server server-multiprofile server-ipv6 server-maxobf users client client-reality client-maxobf; do
            test -f "$extracted/etc/qeli/$name.conf.example"
          done

      - name: Merge the CI-built package into the release asset set
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber; then
            count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
            test "$count" -eq 0
          fi
          find dist -maxdepth 1 -type f -name 'qeli_*_amd64.deb' -delete
          cp "${{ steps.pkg.outputs.source }}" "dist/${{ steps.pkg.outputs.name }}"
          python3 scripts/gen_checksums.py dist
          (
            cd dist
            if grep -q $'\r' SHA256SUMS; then
              echo 'SHA256SUMS must use LF line endings' >&2
              exit 1
            fi
            sha256sum -c SHA256SUMS
          )
          echo "subject=dist/${{ steps.pkg.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Attest the CI-built Linux package
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.assets.outputs.subject }}

      - name: Preserve the package and checksum as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qeli-linux-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.assets.outputs.subject }}
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish only the bytes just built and checked
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "${{ steps.assets.outputs.subject }}" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Downloaded platform assets participate in SHA256SUMS only. Their build
      # provenance must come from the jobs that actually built them; this Linux
      # job must not mint build provenance for externally produced bytes.
