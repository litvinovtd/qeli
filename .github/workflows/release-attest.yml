name: release-build-and-attest

# The Linux package is built from the exact release tag in this job, validated, attested
# with GitHub OIDC, and only then uploaded. This is build provenance, not an attestation
# over bytes that arrived from a maintainer workstation.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and publish (e.g. v0.8.0)'
        required: true

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-build-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-package:
    # Prereleases publish the already qualified candidate bytes. Rebuilding here
    # would replace that package and its sealed checksums after publication.
    # Explicit manual runs and stable releases retain the CI build/attest path.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Admit exact tag, runtime certification and successful CI commit
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_tag.py --tag "$TAG" --require-ci --wait-ci 1800 --require-certification --github-output "$GITHUB_OUTPUT"

      - name: Validate common native legal resources before building
        run: python3 scripts/native_licenses.py

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.meta.outputs.rust_toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: qeli

      - name: Install the portable glibc build driver
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Build the release .deb from this tag
        run: |
          set -euo pipefail
          make -C qeli/debian clean
          make -C qeli/debian deb-portable ARCH=${{ matrix.arch }}

      - name: Locate and inspect the package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find qeli/debian -maxdepth 1 -type f -name 'qeli_*_${{ matrix.arch }}.deb' -print)
          test "${#packages[@]}" -eq 1
          deb="${packages[0]}"
          name="$(basename "$deb")"
          test "$name" = "qeli_${{ steps.meta.outputs.version }}_${{ matrix.arch }}.deb"
          dpkg-deb --info "$deb"
          echo "source=$deb" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the exact bytes to be published
        shell: bash
        run: |
          set -euo pipefail
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb -x "${{ steps.pkg.outputs.source }}" "$extracted"
          python3 scripts/linux_release.py --deb "${{ steps.pkg.outputs.source }}" --arch ${{ matrix.arch }}
          python3 scripts/linux_release.py --binary "$extracted/usr/bin/qeli" --arch ${{ matrix.arch }}
          "$extracted/usr/bin/qeli" version
          python3 scripts/native_licenses.py --bundle "$extracted/usr/share/doc/qeli/licenses/rust"
          for name in server server-multiprofile server-ipv6 server-maxobf users client client-reality client-maxobf; do
            test -f "$extracted/etc/qeli/$name.conf.example"
          done

      - name: Prepare only this architecture's locally built assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.pkg.outputs.source }}" "dist/${{ steps.pkg.outputs.name }}"
          extracted="$(mktemp -d)"
          trap 'rm -rf -- "$extracted"' EXIT
          dpkg-deb -x "${{ steps.pkg.outputs.source }}" "$extracted"
          cp "$extracted/usr/bin/qeli" "dist/qeli-linux-${{ matrix.arch }}"
          python3 scripts/linux_release.py --assets dist
          python3 scripts/gen_checksums.py dist
          echo "subject=dist/${{ steps.pkg.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Attest the CI-built Linux package
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.assets.outputs.subject }}

      - name: Preserve this architecture's admitted build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qeli-linux-built-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # Only one publisher writes the combined checksum manifest, after BOTH builds.
  # Parallel per-architecture release uploads would race and lose checksum entries.
  publish-linux:
    needs: linux-package
    if: needs.linux-package.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Re-admit exact tag before publishing
        id: meta
        run: python3 scripts/release_tag.py --tag "$TAG" --require-ci --wait-ci 1800 --require-certification --github-output "$GITHUB_OUTPUT"
      - name: Merge both builds and generate one checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber; then
            count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
            test "$count" -eq 0
          fi
          for arch in amd64 arm64; do
            candidate="$RUNNER_TEMP/qeli-linux-built-$arch"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "qeli-linux-built-$arch" --dir "$candidate"
            package="qeli_${{ steps.meta.outputs.version }}_$arch.deb"
            python3 scripts/linux_release.py --deb "$candidate/$package" --arch "$arch"
            python3 scripts/linux_release.py --binary "$candidate/qeli-linux-$arch" --arch "$arch"
            python3 scripts/linux_release.py --assets "$candidate"
            find dist -maxdepth 1 -type f -name "qeli_*_$arch.deb" -delete
            cp "$candidate/$package" "$candidate/qeli-linux-$arch" dist/
          done
          python3 scripts/linux_release.py --assets dist
          python3 scripts/gen_checksums.py dist
          (
            cd dist
            if grep -q $'\r' SHA256SUMS; then
              echo 'SHA256SUMS must use LF line endings' >&2
              exit 1
            fi
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qeli-linux-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Publish only the bytes just built and checked
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/qeli_*_amd64.deb dist/qeli_*_arm64.deb \
            dist/qeli-linux-amd64 dist/qeli-linux-arm64 dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Downloaded platform assets participate in SHA256SUMS only. Their build
      # provenance must come from the jobs that actually built them; this Linux
      # job must not mint build provenance for externally produced bytes.
