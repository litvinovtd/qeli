name: release-build-and-attest

# The Linux package is built from the exact release tag in this job, validated, attested
# with GitHub OIDC, and only then uploaded. This is build provenance, not an attestation
# over bytes that arrived from a maintainer workstation.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and publish (e.g. v0.8.0)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-build-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Refuse a tag/source/version mismatch
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tagged_commit="$(git rev-list -n1 "$TAG")"
          checked_commit="$(git rev-parse HEAD)"
          test "$tagged_commit" = "$checked_commit"
          version="$(python3 -c "import tomllib; print(tomllib.load(open('qeli/Cargo.toml','rb'))['package']['version'])")"
          test "$TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$checked_commit" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: qeli

      - name: Install the portable glibc build driver
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Build the release .deb from this tag
        run: |
          set -euo pipefail
          make -C qeli/debian clean
          make -C qeli/debian deb-portable

      - name: Locate and inspect the package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find qeli/debian -maxdepth 1 -type f -name 'qeli_*_amd64.deb' -print)
          test "${#packages[@]}" -eq 1
          deb="${packages[0]}"
          name="$(basename "$deb")"
          test "$name" = "qeli_${{ steps.meta.outputs.version }}_amd64.deb"
          dpkg-deb --info "$deb"
          echo "source=$deb" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the exact bytes to be published
        shell: bash
        run: |
          set -euo pipefail
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb -x "${{ steps.pkg.outputs.source }}" "$extracted"
          "$extracted/usr/bin/qeli" version
          for name in server server-multiprofile server-ipv6 server-maxobf users client client-reality client-maxobf; do
            test -f "$extracted/etc/qeli/$name.conf.example"
          done

      - name: Merge the CI-built package into the release asset set
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber; then
            count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
            test "$count" -eq 0
          fi
          find dist -maxdepth 1 -type f -name 'qeli_*_amd64.deb' -delete
          cp "${{ steps.pkg.outputs.source }}" "dist/${{ steps.pkg.outputs.name }}"
          python3 scripts/gen_checksums.py dist
          (
            cd dist
            if grep -q $'\r' SHA256SUMS; then
              echo 'SHA256SUMS must use LF line endings' >&2
              exit 1
            fi
            sha256sum -c SHA256SUMS
          )
          echo "subject=dist/${{ steps.pkg.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Attest the CI-built Linux package
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.assets.outputs.subject }}

      - name: Preserve the package and checksum as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qeli-linux-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.assets.outputs.subject }}
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish only the bytes just built and checked
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "${{ steps.assets.outputs.subject }}" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Other platform assets are still produced by their platform release processes.
      # Keep the previous signed publication evidence for them, but do not call it build
      # provenance. The .deb is excluded because its stronger attestation was minted above.
      - name: Detect independently-produced non-Linux assets
        id: other
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(find dist -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name '*.deb' -print -quit)" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Attest non-Linux release assets (publication evidence only)
        if: steps.other.outputs.present == 'true'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*
            !dist/SHA256SUMS
            !dist/*.deb
